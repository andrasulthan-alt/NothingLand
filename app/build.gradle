plugins {
    id 'com.android.application'
}

android {
    compileSdk 33
    sourceSets {
        github {
            manifest.srcFile 'github/AndroidManifest.xml'
        }
    }
    defaultConfig {
        applicationId "com.theglitchh.NothingLand"
        minSdk 26
        targetSdk 33
        versionCode 4
        versionName "0.4"
        // Repo the in-app updater checks for new releases. Point this at YOUR fork,
        // not the upstream author's repo, or you'll get prompted to install their build.
        buildConfigField "String", "UPDATE_REPO", "\"andrasulthan-alt/OmniLand\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        github {
            def tmpFilePath = System.getProperty("user.home") + "/work/_temp/keystore/keystore.jks"
            storeFile = file(tmpFilePath)
            storePassword System.getenv("SIGNING_KEY_PASSWORD")
            keyAlias System.getenv("SIGNING_KEY_ALIAS")
            keyPassword System.getenv("SIGNING_KEY_PASSWORD")
        }
        // Permanent OmniLand release key. Supplied by GitHub Actions secrets,
        // never committed to the repo. Every release MUST be signed with this
        // same key, otherwise updates can't install over the previous version.
        release {
            def ksPath = System.getenv("OMNILAND_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storeType "pkcs12"
                storePassword System.getenv("OMNILAND_KEYSTORE_PASSWORD")
                keyAlias System.getenv("OMNILAND_KEY_ALIAS")
                keyPassword System.getenv("OMNILAND_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        github {
            minifyEnabled false
            buildConfigField "Boolean", "AUTO_UPDATE", "true"
            signingConfig signingConfigs.github
        }
        release {
            minifyEnabled false
            buildConfigField "Boolean", "AUTO_UPDATE", "false"
            if (System.getenv("OMNILAND_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            buildConfigField "Boolean", "AUTO_UPDATE", "true"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        // Don't let old lint warnings in the upstream code block release builds.
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'androidx.core:core:1.9.0'
    implementation 'com.google.android.material:material:1.8.0-alpha01'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'org.ocpsoft.prettytime:prettytime:5.0.2.Final'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.6.10'
}
