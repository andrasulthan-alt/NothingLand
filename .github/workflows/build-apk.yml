name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ NL-beta ]

jobs:
  build:
    # Pinned so the Ubuntu 26 switch of "ubuntu-latest" (Oct 2026) can't break builds.
    runs-on: ubuntu-24.04
    env:
      # Signed release build when the signing secrets exist; debug build otherwise (e.g. forks).
      HAS_KEY: ${{ secrets.OMNILAND_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11

      - name: Fix gradlew line endings and grant execute permission
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        env:
          OMNILAND_KEYSTORE_B64: ${{ secrets.OMNILAND_KEYSTORE_B64 }}
          OMNILAND_KEYSTORE_PASSWORD: ${{ secrets.OMNILAND_KEYSTORE_PASSWORD }}
          OMNILAND_KEY_ALIAS: ${{ secrets.OMNILAND_KEY_ALIAS }}
          OMNILAND_KEY_PASSWORD: ${{ secrets.OMNILAND_KEY_PASSWORD }}
        run: |
          echo "$OMNILAND_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/omniland-release.jks"
          export OMNILAND_KEYSTORE_PATH="$RUNNER_TEMP/omniland-release.jks"
          ./gradlew assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/omniland-release.jks"

      - name: Upload release APK
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: omniland-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build debug APK (no signing key configured)
        if: env.HAS_KEY != 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: env.HAS_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: omniland-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
